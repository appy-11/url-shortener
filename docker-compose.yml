services:
  postgres:
    image: postgres:17-alpine
    container_name: shortly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortly
      POSTGRES_USER: shortly
      POSTGRES_PASSWORD: shortly
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortly -d shortly']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shortly-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shortly-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_URL: http://localhost:5173

      # Docker service names are used instead of localhost.
      DATABASE_URL: postgresql://shortly:shortly@postgres:5432/shortly
      DB_POOL_MAX: 10

      SHORT_URL_DOMAIN: short.ly

      REDIS_URL: redis://redis:6379

    ports:
      - '3000:3000'

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Run the compiled migration, then start the API.
    command: >
      sh -c "node dist/infrastructure/postgres/migrate.js &&
             node dist/server.js"

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shortly-worker
    restart: unless-stopped

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://shortly:shortly@postgres:5432/shortly
      DB_POOL_MAX: 10

      SHORT_URL_DOMAIN: short.ly

      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # The worker processes BullMQ analytics jobs.
    command: ['node', 'dist/worker.js']

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

      # Vite variables are build-time variables.
      args:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_SHORT_URL_DOMAIN: short.ly

    container_name: shortly-frontend
    restart: unless-stopped

    ports:
      - '5173:80'

    depends_on:
      - api
volumes:
  postgres_data:
  redis_data:
