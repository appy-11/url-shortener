server {
    listen 80;

    server_name _;

    # Serve the React/Vite application.
    root /usr/share/nginx/html;
    index index.html;

    # React Router support.
    #
    # If a requested path does not correspond to a real file,
    # return index.html so React Router can handle the route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}